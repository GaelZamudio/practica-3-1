<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bases de Datos - IPN ESCOM</title>
    <style>
        /* Variables de color institucionales y neutros */
        :root {
            --color-ipn: #6c1d45; /* Guinda institucional IPN */
            --color-ipn-dark: #4a132f;
            --color-ipn-accent: #8b265c;
            --color-bg: #f4f6f9;
            --color-card-bg: #ffffff;
            --color-text-main: #2c3e50;
            --color-text-muted: #64748b;
            --color-border: #e2e8f0;
            --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* Estilos generales */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--color-bg);
            color: var(--color-text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            line-height: 1.6;
        }

        /* Contenedor principal estilo tarjeta */
        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--color-card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid var(--color-border);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 15px 35px rgba(108, 29, 69, 0.12);
        }

        /* Encabezado Institucional */
        header {
            background: linear-gradient(135deg, var(--color-ipn) 0%, var(--color-ipn-dark) 100%);
            color: #ffffff;
            text-align: center;
            padding: 35px 25px;
            border-bottom: 4px solid var(--color-ipn-accent);
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        header h2 {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 1px;
            opacity: 0.9;
            text-transform: uppercase;
        }

        /* Cuerpo del contenido */
        main {
            padding: 35px 30px;
        }

        .subject-badge {
            display: inline-block;
            background-color: rgba(108, 29, 69, 0.08);
            color: var(--color-ipn);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .info-item {
            background-color: #fafbfc;
            padding: 16px 20px;
            border-radius: 10px;
            border-left: 3px solid var(--color-ipn);
            border-top: 1px solid var(--color-border);
            border-right: 1px solid var(--color-border);
            border-bottom: 1px solid var(--color-border);
        }

        .info-item.full-width {
            grid-column: span 2;
        }

        .info-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--color-text-muted);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--color-text-main);
        }

        /* Pie de página sutil */
        footer {
            text-align: center;
            padding: 18px 20px;
            background-color: #fafbfc;
            border-top: 1px solid var(--color-border);
            font-size: 0.85rem;
            color: var(--color-text-muted);
        }

        /* Adaptabilidad para dispositivos móviles */
        @media (max-width: 580px) {
            header h1 {
                font-size: 1.15rem;
            }

            header h2 {
                font-size: 0.9rem;
            }

            main {
                padding: 25px 20px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .info-item.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Encabezado Institucional -->
        <header>
            <h1>Instituto Politécnico Nacional</h1>
            <h2>Escuela Superior de Cómputo</h2>
        </header>

        <!-- Contenido Principal -->
        <main>
            <div style="text-align: center;">
                <span class="subject-badge">Práctica 3.1</span>
            </div>

            <div class="info-grid">
                <!-- Nombre del Estudiante -->
                <div class="info-item full-width">
                    <div class="info-label">Alumno</div>
                    <div class="info-value">Gael Armando Zamudio Monroy</div>
                </div>

                <!-- Materia -->
                <div class="info-item full-width">
                    <div class="info-label">Materia</div>
                    <div class="info-value">Bases de Datos</div>
                </div>

                <!-- Grupo -->
                <div class="info-item">
                    <div class="info-label">Grupo</div>
                    <div class="info-value">3BV1</div>
                </div>

                <!-- Fecha -->
                <div class="info-item">
                    <div class="info-label">Fecha</div>
                    <div class="info-value">01 de oct de 2026</div>
                </div>
            </div>
        </main>

        <!-- Pie de página -->
        <footer>
            <span>Demostración de Plantilla Académica</span>
        </footer>
    </div>

</body>
</html>
